name: Channel Maintenance

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh channels from live sources
        run: python scripts/refresh_channels.py

      - name: Enrich missing logos
        run: python scripts/enrich_logos.py

      - name: Health check channels
        run: python scripts/check_channels.py

      - name: Commit updates
        run: |
          git config --global user.name "streamverse-bot"
          git config --global user.email "streamverse-bot@users.noreply.github.com"
          git add backend/data/custom.json backend/data/blocked.json backend/data/channel-health.json frontend/public/channels.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync channels and health status [skip ci]"
            git push
          else
            echo "No channel changes detected."
          fi
