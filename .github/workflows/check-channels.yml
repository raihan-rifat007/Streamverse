name: Channel Maintenance

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-maintenance
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure data directories
        run: |
          mkdir -p backend/data frontend/public

      - name: Refresh channels from live sources
        run: python scripts/refresh_channels.py

      - name: Enrich missing logos
        run: python scripts/enrich_logos.py

      - name: Health check channels
        run: python scripts/check_channels.py

      - name: Commit and push updates
        run: |
          git config user.name "streamverse-bot"
          git config user.email "streamverse-bot@users.noreply.github.com"
          git add \
            backend/data/custom.json \
            backend/data/blocked.json \
            backend/data/channel-health.json \
            backend/data/playlists.json \
            frontend/public/channels.json \
            || true
          if git diff --cached --quiet; then
            echo "No channel changes detected."
          else
            git commit -m "chore: sync channels and health status [skip ci]"
            git push
          fi
